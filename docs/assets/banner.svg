    <filter id="shadow" x="616" y="29" width="452" height="302" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#070B1D" flood-opacity="0.32"/>
